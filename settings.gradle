/*
 * 严格组件化结构：app 只负责组装，core/legacy 提供基础能力，
 * 每个业务 feature 由 api（公开契约）和 impl（具体实现）组成。
 */
pluginManagement {
    includeBuild('build-logic')

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17) ||
        JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_18)) {
    throw new GradleException(
            "ToolKit requires JDK 17, but Gradle is running on ${JavaVersion.current()}. " +
                    "Set JAVA_HOME to a JDK 17 installation and retry."
    )
}

dependencyResolutionManagement {
    // 禁止各 module 在自己的 build.gradle 里再声明仓库
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
        // e-iceblue 仅提供 http 仓库，单独保留 allowInsecureProtocol
        maven {
            url 'http://repo.e-iceblue.com/nexus/content/groups/public/'
            allowInsecureProtocol = true
        }
    }
}

rootProject.name = "ToolKit"

include ':app'
include ':core:model'
include ':core:lifecycle'
include ':core:designsystem'
include ':core:ui'
include ':core:navigation'
include ':core:session'
include ':core:locale'
include ':core:startup'
include ':core:web'
include ':core:network'
include ':core:utils'
include ':legacy:utils'
include ':legacy:network'
include ':module_login:api'
include ':module_login:impl'
include ':module_home:api'
include ':module_home:impl'
include ':module_mine:api'
include ':module_mine:impl'
include ':module_ota:api'
include ':module_ota:impl'
