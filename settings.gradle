/*
 * 组件化项目模块管理
 * ---------------------------------------------
 *  :app            应用壳工程（仅负责集成，本身不写业务）
 *  :lib_common     基础库：BaseActivity、MVVM/MVI、ARouter、主题、多语言、屏幕适配、扩展等
 *  :network        网络层：Retrofit + OkHttp + Coroutines/Flow
 *  :utils          工具类：文件、Bitmap、SP、日期、日志等
 *  :widget         自定义 View：对话框、TitleBar、LoadingLayout 等
 *  :module_login   业务模块：登录
 *  :module_home    业务模块：主页（类微信 Tab 架构）
 *  :module_mine    业务模块：我的
 * ---------------------------------------------
 */
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

dependencyResolutionManagement {
    // 禁止各 module 在自己的 build.gradle 里再声明仓库
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
        // e-iceblue 仅提供 http 仓库，单独保留 allowInsecureProtocol
        maven {
            url 'http://repo.e-iceblue.com/nexus/content/groups/public/'
            allowInsecureProtocol = true
        }
    }
}

rootProject.name = "ToolKit"

include ':app'
include ':lib_common'
include ':network'
include ':utils'
include ':widget'
include ':module_login'
include ':module_home'
include ':module_mine'
