plugins {
    id 'toolkit.android.feature'
    id 'toolkit.android.arouter'
}

android {
    namespace 'com.zhangyt.module.mine'
    resourcePrefix 'mine_'
}

dependencies {
    implementation project(':core:ui')
    implementation project(':core:navigation')
    implementation project(':core:session')
    implementation project(':core:locale')
    implementation project(':core:designsystem')
    implementation project(':core:startup')

    if ((findProperty('standalone') ?: '') == 'mine') {
        implementation project(':module_ota')
    }
}
