plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.zhangyt.toolkit'
    compileSdk rootProject.ext.android.compileSdkVersion
    buildToolsVersion rootProject.ext.android.buildToolsVersion

    defaultConfig {
        applicationId "com.zhangyt.toolkit"
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode rootProject.ext.android.versionCode
        versionName rootProject.ext.android.versionName

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 多语言打包配置：只保留需要的语言资源
        resourceConfigurations += ["zh", "en", "ja"]
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", "\"https://fake.api.example.com/\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", "\"https://fake.api.example.com/\""
            // 临时用 debug keystore 签 release，仅限本地联调；上架请换正式 keystore
            signingConfig signingConfigs.debug
        }
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
}

// ARouter：通过 kapt DSL + 全局 JavaCompile 两层兜底
// Hilt 的 hiltJavaCompile${variant} 是独立 JavaCompile task，既不继承
// defaultConfig.javaCompileOptions，也不读 kapt.arguments，必须直接 configureEach
kapt {
    arguments {
        arg("AROUTER_MODULE_NAME", project.name)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-AAROUTER_MODULE_NAME=${project.name}")
}

dependencies {
    // 只依赖业务模块。lib_common 会通过 api 依赖自动传递。
    implementation project(path: ':lib_common')
    implementation project(path: ':module_login')
    implementation project(path: ':module_home')
    implementation project(path: ':module_mine')

    // ARouter 注解处理器（每个有 @Route 的模块都要加）
    kapt rootProject.ext.dependencies["arouter-compiler"]

    // Hilt
    implementation rootProject.ext.dependencies["hilt"]
    ksp rootProject.ext.dependencies["hilt-compiler"]

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
