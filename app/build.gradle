plugins {
    id 'toolkit.android.application'
    id 'toolkit.android.hilt'
    id 'toolkit.android.arouter'
}

android {
    namespace 'com.zhangyt.toolkit'

    defaultConfig {
        applicationId 'com.zhangyt.toolkit'
        versionCode 1
        versionName '1.0.0'
        multiDexEnabled true
        resourceConfigurations += ['zh', 'en', 'ja']
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BASE_URL', '"https://fake.api.example.com/"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'BASE_URL', '"https://fake.api.example.com/"'
            signingConfig signingConfigs.debug
        }
    }

    bundle.language.enableSplit = true
}

dependencies {
    implementation project(':core:startup')
    implementation project(':core:navigation')
    implementation project(':core:session')
    implementation project(':core:network')
    implementation project(':core:web')
    implementation project(':core:designsystem')
    implementation project(':core:ui')

    implementation project(':module_login')
    implementation project(':module_home')
    implementation project(':module_mine')
    implementation project(':module_ota')
}
